name: Release

# Push a tag like v0.2.0 (or run manually) to build PoamForge.exe and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/poamforge.exe PoamForge.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: PoamForge ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          files: PoamForge.exe
